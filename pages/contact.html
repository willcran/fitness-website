<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Contact - ToKa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />

    <link rel="icon" type="image/x-icon" href="/assets/logo/favicon.png">
    <script src="/js/components.js"></script>
  </head>

  <body>
    <div id="header"></div>

    <div class="content">

      <div class="centred-content">
        <h1>Contact Form</h1>

        <form class="form-box">

          <label for="email">Email address</label>
          <input type="text" id="fname" name="firstname" placeholder="email@example.com">

          <label for="country">Country</label>
          <select id="country" name="country">
            <option value="gb">Great Britain</option>
            <option value="fr">France</option>
            <option value="usa">USA</option>
          </select>

          <label for="subject">Subject</label>
          <textarea id="subject" name="subject" placeholder="Dear ToKa..." style="height:200px"></textarea>

          <input type="submit" value="Submit">

        </form>

      </div>

    </div>

    <div id="footer"></div>

    <script src="/js/script.js"></script>
    
  </body>
</html>
